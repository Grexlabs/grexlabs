<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="GrexLabs — Free AI API Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="0.5" stop-color="#101826"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#22d3ee;#a78bfa;#3b82f6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#3b82f6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#3b82f6;#22d3ee;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e9f0"/>
      <stop offset="1" stop-color="#9aa4b8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="240" rx="18" fill="url(#bg)"/>
  <rect width="960" height="240" rx="18" fill="none" stroke="#1f2a40" stroke-width="1.5"/>

  <!-- floating glow orbs -->
  <circle cx="150" cy="60" r="90" fill="url(#orb1)">
    <animate attributeName="cx" values="150;260;150" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;120;60" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="180" r="110" fill="url(#orb2)">
    <animate attributeName="cx" values="820;700;820" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="180;110;180" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- particles -->
  <g fill="#7dd3fc">
    <circle cx="120" cy="190" r="2.5" opacity="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="40" r="2" opacity="0.6"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="200" r="2.2" opacity="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="50" r="2.6" opacity="0.9"><animate attributeName="opacity" values="1;0.25;1" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="120" r="2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="150" r="1.8" opacity="0.6"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- hex emblem -->
  <g transform="translate(70,62) scale(1.9)" filter="url(#glow)">
    <path d="M32 6 L54 19 V45 L32 58 L10 45 V19 Z" fill="none" stroke="url(#hex)" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M32 16.5 L45.5 47.5 H38.6 L36.3 41.5 H27.7 L25.4 47.5 H18.5 Z" fill="#e5e9f0"/>
    <path d="M29.3 36.8 h5.4 L32 28.6 Z" fill="#0b0e14"/>
    <path d="M32 6 L54 19 V45 L32 58 L10 45 V19 Z" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-linejoin="round" opacity="0.9">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title with shimmer -->
  <text x="185" y="118" font-family="Arial Black, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="4" fill="url(#shimmer)" filter="url(#glow)">GREXLABS</text>
  <text x="187" y="160" font-family="Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="6" fill="#9fb0cc">FREE · OPENAI-COMPATIBLE · NO API KEY</text>

  <!-- animated pill badges -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <g>
      <rect x="186" y="182" width="148" height="30" rx="15" fill="#0f1b33" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="204" cy="197" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="218" y="202" fill="#cfe0ff">314+ MODELS</text>
    </g>
    <g>
      <rect x="346" y="182" width="170" height="30" rx="15" fill="#0f1b33" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="362" y="202" fill="#b8f3ff">KEYLESS FREE API</text>
    </g>
    <g>
      <rect x="528" y="182" width="186" height="30" rx="15" fill="#0f1b33" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="544" y="202" fill="#ddd6fe">GPT-6.2 ASTRA</text>
    </g>
    <g>
      <rect x="726" y="182" width="150" height="30" rx="15" fill="#0f1b33" stroke="#22c55e" stroke-width="1.5"/>
      <text x="742" y="202" fill="#bbf7d0">SEARCH + IMAGES</text>
    </g>
  </g>
</svg>
